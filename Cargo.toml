[workspace]
resolver = "2"

members = ["attic", "client", "server", "token"]

[workspace.dependencies]
anyhow = "1.0.98"
async-stream = "0.3.6"
async-trait = "0.1.88"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = "0.4.41"
clap = { version = "4.5", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["debug"] }
digest = "0.10"
displaydoc = "0.2.5"
enum-as-inner = "0.7"
futures = "0.3.31"
hex = "0.4.3"
http-body-util = "0.1.3"
humantime = "2.2.0"
humantime-serde = "1.1.1"
lazy_static = "1.5.0"
pin-project = "1.1.10"
regex = "1.11.1"
reqwest = { version = "0.13", default-features = false, features = [
	"json",
	"stream",
] }
rsa = "0.9.8"
ryu = "1.0.20"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.14.0"
sha2 = "0.10.9"
tokio = "1.46.1"
tokio-util = "0.7.15"
toml = "1.0"
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.19"
uuid = { version = "1.17.0", features = ["v4"] }
xdg = "3.0.0"

# Dev dependencies
criterion = { version = "0.8.0", features = ["html_reports", "async_tokio"] }
fastcdc = { version = "3.2.1", features = ["tokio"] }

[workspace.dependencies.sea-orm]
version = "1.1.13"
features = [
	"runtime-tokio-rustls",
	"macros",
	"sqlx-postgres",
	"sqlx-sqlite",
	"debug-print",
]

[workspace.dependencies.async-compression]
version = "0.4.25"
features = ["tokio", "xz", "zstd", "brotli"]
