[package]
name = "attic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-stream = { version = "0.3.6", optional = true }
base64 = { workspace = true }
bytes = { workspace = true }
displaydoc = { workspace = true }
ed25519-compact = "2.1.1"
fastcdc = "3.2.1"
futures = { workspace = true }
hex = { workspace = true }
lazy_static = { workspace = true }
nix-base32 = "0.2.0"
pin-project = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
wildmatch = "2.4.0"

# Native libnixstore bindings.
cxx = { version = "1.0", optional = true }

[dependencies.tokio]
version = "1.46.1"
optional = true
features = [
	"io-util",
	"macros",
	"sync",
]

[dev-dependencies]
criterion = { workspace = true }
fastcdc = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1.2.29"
cxx-build = { version = "1.0", optional = true }
system-deps = { version = "7.0", optional = true }
version-compare = "0.2.0"

[package.metadata.system-deps]
nix-store = { version = "2.24", feature = "nix_store" }
nix-main = { version = "2.24", feature = "nix_store" }

[features]
default = [
	"chunking",
	"io",
	"nix_store",
	"tokio",
]

# Chunking.
chunking = ["tokio", "io", "dep:async-stream"]

# Native libnixstore bindings.
#
# When disabled, the native Rust portions of nix_store can still be used.
nix_store = [
	"tokio",
	"tokio/fs",
	"tokio/process",
	"dep:cxx",
	"dep:cxx-build",
	"dep:system-deps",
]

# IO utilities.
io = ["tokio", "dep:async-stream"]

# Tokio runtime.
tokio = ["dep:tokio", "tokio/rt", "tokio/time"]

[[bench]]
name = "chunking"
harness = false
